# lefthook.yml — local quality gates, no hosted CI required (claude-kickoff)
#
# The enforcement spine: the project's gate suite runs LOCALLY on every commit
# and push, so a broken or unsafe change can't land in the first place. This is
# the CI-less, self-served model — the box is the canonical environment.
#
# What ships ready-to-run: the two GENERIC, language-agnostic scanners
# (scan-secrets, scan-structure). They work the moment the repo exists.
#
# What bootstrap/adopt FILL: the stack-specific gates (typecheck · lint · test).
# kickoff is language-agnostic, so the gate machinery is a PATTERN; the agent
# that scaffolds (bootstrap) or onboards (adopt) the repo knows the stack and
# uncomments + fills the stanzas below for it (tsc/biome/vitest · cargo · ruff/
# pytest · …). Until then the commented stanzas are inert and the scanners still run.
#
# Velocity-first (it must never be the thing that catches you):
#   - pre-commit = CHEAP gates only (typecheck · lint · secret-scan) → fast loop
#   - pre-push   = HEAVIER gates (full tests) + advisory structural scan
#   - the adversarial `review` skill is sized to the diff (trivial → skip), run by
#     the coordinator before a substantial commit — it is not a git hook.
#
# Install: `lefthook install` (bootstrap/adopt do this). Honest caveat: hooks are
# bypassable with `--no-verify` — the agent honors them; a non-technical operator won't bypass.

pre-commit:
  parallel: true
  commands:
    # Identity: catch a private name or a machine path at the moment it is WRITTEN. Added lines
    # only, so inherited content never re-fires — the release gate is the fail-closed backstop for
    # the whole tree. Twice a release was held to scrub a name that had sat in a comment for weeks;
    # by then a public tag cannot be unpublished. ALLOW_IDENTITY=1 is the sanctioned deliberate path.
    identity-scan:
      run: bash scripts/scan-identity.sh --staged
    secret-scan:
      run: bash scripts/scan-secrets.sh --staged
      skip:
        - merge
        - rebase
    # memory truth-invariant (cheap): a memory declaring `supersedes: <slug>` MUST have DELETED
    # that slug's file — else a stale + a corrected memory both live on disk and a future session
    # can retrieve the WRONG one. Exit 1 on a real contradiction or a malformed field; a pure
    # no-op when nothing declares supersedes (the current live state). Blocks the commit.
    memory-supersede:
      run: bash scripts/memory-supersede-check.sh
      skip:
        - merge
        - rebase
    # memory budget (ADVISORY — `|| true` so it never blocks): the always-loaded MEMORY.md index
    # is a per-session context tax; warn LOUD when it crosses the budget so it gets compacted, but
    # never fail a commit over it (the index is a cache — compacting is the human's judgement call).
    memory-budget:
      run: bash scripts/memory-budget-check.sh || true
      skip:
        - merge
        - rebase
    # ─── stack gates — bootstrap/adopt uncomment + fill for the detected stack ───
    # typecheck:
    #   glob: "*.{ts,tsx}"          # (TS example) drop the glob for whole-project gates
    #   run: <typecheck command, e.g.  npx tsc --noEmit  /  cargo check  /  mypy .>
    # lint:
    #   run: <lint command, e.g.  npx biome check .  /  cargo clippy -- -D warnings  /  ruff check .>

pre-push:
  parallel: true
  commands:
    structure-scan:
      # Advisory: prints footgun findings for the `harden` skill to close; does not block.
      run: bash scripts/scan-structure.sh
      skip:
        - merge
        - rebase
    # kickoff-itself's test suite for the brownfield-devex layer: the adopt-manifest keystone,
    # the .kickoff/bin seam shims (§1.4), seam-sync on pull (§2.3), preflight #8 (Fix 9), and
    # supervisor.log rotation. Pure bash + coreutils + python3 — no stack toolchain needed.
    test:
      run: bash scripts/adopt-selftest.sh
      skip:
        - merge
        - rebase
    # eject (§2.4): the reverse of adopt — the `reverse` engine, the adopt→eject acceptance gate
    # (byte-for-byte pristine), and the credential/destruction/no-clobber invariants. Same deps.
    eject-test:
      run: bash scripts/eject-selftest.sh
      skip:
        - merge
        - rebase
    # pull (§7 step 4): `kickoff pull core-vNEXT` as a verifiable engine upgrade — the changelog
    # delta, the whole-tree lock + dual-format preflight #6, the split-charter regen (Fix 5), the
    # adopters registry + parked worktrees (Fix 7), and THE acceptance: the adopter's own layer
    # (KICKOFF.local.md, CLAUDE.md, code) is byte-identical after a pull. Same deps (+ git).
    pull-test:
      run: bash scripts/pull-selftest.sh
      skip:
        - merge
        - rebase
    # repo-config pins (the 2026-09-01 triple-lane wedge): the core repo's OWN dispatch
    # config must name models that RESOLVE in a worktree's view (tracked bytes + global
    # config) — no agent-level model pin in the coordinator charter, no delisted model
    # name, no inline gateway key in tracked bytes, default model present in the global
    # provider list. RED controls run the detectors on the incident's real inputs.
    repo-config-pin-test:
      run: bash scripts/repo-config-pin-selftest.sh
      skip:
        - merge
        - rebase
    # adopt-migrate (origin migration): the fleet/stranger turnkey that moves a pull-adopter
    # between core ORIGINS (old repo → clean public line, first tag a pre-release). Proves the
    # fail-closed refusals (origin unreachable · tag missing · existence-contract violation —
    # all leaving the adopter BYTE-UNTOUCHED), the alpha bare-pull seam (auto-select refuses a
    # pre-release tag, so the turnkey names it), the green migration's CONSUMED state (the
    # adopter's own instance.env/clone-origin/core.lock/registry row read back + a real re-pull
    # PULL OK), idempotent re-run, and the rollback artifact. Two-repo fixture topology with NO
    # shared history — the deploy shape, never the dev checkout.
    adopt-migrate-test:
      run: bash scripts/adopt-migrate-selftest.sh
      skip:
        - merge
        - rebase
    # THE INTEGRATION PROOF (journey-e2e): the per-slice selftests above each prove ONE slice; this
    # drives realistic brownfield + greenfield repos through the WHOLE journey against the REAL engine
    # — adopt → the SIMULATED /adopt session (crew/tracker/memory/gates authored + RECORDED, the half a
    # prior pass STUBBED into a false green) → run → serve → pull → eject — and asserts each stage COMPOSES,
    # ending on the byte-for-byte zero-trace acceptance. Fully isolated (mktemp fixtures, scratch ports, a
    # hermetic stub `claude`, a live-front-door canary) and fast (~8s), so it earns a spot on the gate.
    journey-e2e:
      run: bash scripts/journey-e2e.sh
      skip:
        - merge
        - rebase
    # adopt BRAINS (v0.26): adoption must land a MIND, not just plumbing. `kickoff adopt` wired gates, a
    # pin, a bot and a worker and then handed the one step needing intelligence to a printed sentence
    # telling a human to type `/adopt` — so six live adopters sat half-adopted, one through 35
    # memory-writing sessions with zero .claude/agents/. The detector that should have caught it was
    # predicated on "gates unwired", which adopt now always satisfies, so it was structurally dead for
    # every modern adoption and reported GREEN. Listed HERE because release-gate.sh discovers suites ONLY
    # from this block: an unlisted *-selftest.sh is invisible to the gate and skipped by manifest
    # coverage, so it can rot red while the release reports "all suites GREEN". The detector lanes run
    # with the gates WIRED on purpose — a fixture that strips them tests the OLD bug and goes green.
    adopt-brains-test:
      run: bash scripts/adopt-brains-selftest.sh
      skip:
        - merge
        - rebase
    # incomplete-adopt detection (scout #1): the ABANDONED-but-ACTIVE shape is LOUDLY flagged (verify
    # banner + preflight [warn]) while a LEGIT fresh adopt stays green AND bootable — the hard guard
    # is "never a startup-breaking refusal" (preflight runs at every supervisor start). Same deps.
    adopt-incomplete-test:
      run: bash scripts/adopt-incomplete-selftest.sh
      skip:
        - merge
        - rebase
    # `kickoff doctor` (core-v0.19 cluster 4): the idempotent REPAIR verb — back-fills an already-
    # adopted repo's missing generic gates + memory index (the pulled-but-unrepaired adopter shape),
    # records what it creates (eject-reversible), refuses a non-adopted dir, and never clobbers or
    # re-records on a second run. Hermetic (mktemp fixtures + a scratch core, RED-first).
    doctor-test:
      run: bash scripts/doctor-selftest.sh
      skip:
        - merge
        - rebase
    # board auto-serve (scout #4): `kickoff up` brings the Mission Control board up idempotently —
    # free-port pick (ss pre-check), serve-status read FIRST (never clobber, never bare :443),
    # recorded stable ports, fail-soft, --dry-run starts NOTHING, token never printed. Fully
    # stubbed (tailscale/ss/curl/server are env-seam stubs) — no real tailscale is ever touched.
    board-serve-test:
      run: bash scripts/board-serve-selftest.sh
      skip:
        - merge
        - rebase
    # §5 THE PLUGIN: engine-as-CC-plugin adopt/pull/eject — marketplace + machine-entry lifecycle, the
    # plugin cache resync (verify-first · sibling-gate · settings.json byte-integrity), preflight #8's
    # cache half. Fully isolated (scratch CLAUDE_CONFIG_DIR + a hermetic stub `claude`).
    plugin-test:
      run: bash scripts/plugin-selftest.sh
      skip:
        - merge
        - rebase
    # reconcile (Phase-2 G9): `adopt --reconcile` generates a manifest for an ALREADY-adopted repo (the
    # legacy-adopter migration path) — recording ONLY provably-kickoff artifacts, zero adopter writes; + the #8
    # already-adopted recovery route. Same deps.
    reconcile-test:
      run: bash scripts/reconcile-selftest.sh
      skip:
        - merge
        - rebase
    # The sweep mails OTHER orgs unprompted, so its three rules (only real findings, notify
    # once, never yourself) are the difference between a useful nudge and noise in someone
    # else's inbox. Deliberately NOT on a cadence — that is an operator's call. Hermetic:
    # fake orphaned-work + agent-mail in a scratch dir, four mutants proven RED. Registered
    # here because this file is the ONLY place release-gate discovers suites — an
    # unregistered one rots red while the gate reports green.
    orphan-sweep-test:
      run: bash scripts/orphan-sweep-selftest.sh
      skip:
        - merge
        - rebase
    # supervisor auth self-heal (staged, inert until armed): auth-heal.sh's detect/escalate/fail-safe
    # logic — pure + hermetic (stubbed `claude`, no network, mktemp fixtures).
    auth-heal-test:
      run: bash scripts/auth-heal-selftest.sh
      skip:
        - merge
        - rebase
    # telegram-channel reap-on-startup (v0.6 hardening): bridge-reap.sh's verify-before-kill
    # ladder (FAIL TOWARD NOT KILLING) + the session-run.sh wiring — hermetic (/tmp fixtures,
    # stub processes the test spawns and owns by exact pid; never touches a live bridge).
    bridge-reap-test:
      run: bash scripts/bridge-reap-selftest.sh
      skip:
        - merge
        - rebase
    # session-run pty-wrap (v0.7 G1 §2.4): the wrap is decided by a REAL TTY test ([ -t 0 ]),
    # never an inheritable env var (the leaked-_PTY_WRAPPED crash-loop of 2026-07-12), + the
    # fail-loud loop guard when script(1) is broken/missing. Hermetic (mktemp fixtures, stub
    # claude/tail, env -i scrubbed; RED-on-old proven against HEAD, auto-skip when identical).
    ptywrap-test:
      run: bash scripts/ptywrap-selftest.sh
      skip:
        - merge
        - rebase
    # config precedence (v0.7 G1 §2.3): one rule at every seam — argv > pre-set env > instance.env
    # > engine default; MODEL file-durable through a real `kickoff up` spawn chain; PERMISSION_MODE
    # NEVER file-imported (a gitignored line can't arm autonomy); `--auto` grant-only (no effort=max).
    # Hermetic (mktemp fixtures, stub claude/start-supervisor, env -i scrubbed; RED-on-old proven
    # against HEAD, auto-skip when byte-identical).
    config-precedence-test:
      run: bash scripts/config-precedence-selftest.sh
      skip:
        - merge
        - rebase
    # spawn hygiene (v0.7 G1 §2.5): the engine-owned positive KEEP-list at cmd_up's org-entry
    # boundary — a caller session's _PTY_WRAPPED/TELEGRAM_STATE_DIR/MEMORY_*/… can never leak
    # into a spawned org (the 07-12 crash-loop + channel-hijack class), KEEP-list vars + the
    # KICKOFF_ENV_KEEP escape hatch survive. Hermetic (mktemp fixtures, stub claude with a
    # baked-in probe, env -i controlled caller env; RED-on-old proven against HEAD, auto-skip
    # when byte-identical).
    spawn-hygiene-test:
      run: bash scripts/spawn-hygiene-selftest.sh
      skip:
        - merge
        - rebase
    # start surface (v0.7 G1 §2.2): `kickoff up` is the ONLY start surface — `--detach`
    # (setsid/nohup + supervisor-log wiring + size rotate, go-autonomous's one real job
    # engine-owned), `--replace` (exact verified lock pid, TERM → ≤35s wait → never
    # KILL -9; foreign-cmdline pid → refuse, never signal), the pin-redirect (any kickoff
    # binary hands off to the repo's PINNED engine, argv verbatim — the wrapper-killer),
    # the go-autonomous deprecation shim, and the slice-3 hygiene boundary holding through
    # --detach. Hermetic (mktemp fixtures, stub start-supervisor, exact-pid cleanup — no
    # live supervisor ever touched; RED-on-old proven against HEAD, auto-skip when
    # byte-identical).
    start-surface-test:
      run: bash scripts/start-surface-selftest.sh
      skip:
        - merge
        - rebase
    # engine hop (v0.7 G1 slice 5): `kickoff pull` cycles the RUNNING worker — the supervisor's
    # hop unit (pin watched every tick, hop only at a session boundary, exec = same PID so the
    # lock + grant carry, preflight-red → hop-blocked flag + ONE alert, origin-inert for the
    # dogfood repo) + acquire_lock's own-pid recognition. Hermetic (marker-extracted unit with a
    # stubbed exec; ONE real fixture supervisor in a scratch REPO_DIR, exact-pid teardown;
    # RED-on-old proven against HEAD, auto-skip when byte-identical).
    hop-test:
      run: bash scripts/hop-selftest.sh
      skip:
        - merge
        - rebase
    # pin-redirect verify-before-exec: the redirect (up/adopt/doctor) gated on core.lock EXISTING,
    # then exec'd whatever $KICKOFF_CORE_DIR named — never reading the commit the lock PINS. preflight
    # #6 checks exactly this but runs INSIDE the engine, i.e. after the handover. The suite's
    # load-bearing lane is RED-on-old: HEAD's front door really does exec a decoy engine, so a green
    # here means the gate, not the wiring. Registered because an unlisted suite never runs.
    pin-verify-test:
      run: bash scripts/pin-verify-selftest.sh
      skip:
        - merge
        - rebase
    # model-quota fallback (v0.8): the supervisor's REACTIVE model-fallback belt — detect the
    # weekly model-limit string in the session's captured pty output, switch the worker to a
    # cheaper fallback model (rewrite instance.env atomically + export to beat the fossilised
    # MODEL + refresh), alert, and latch one-shot; the false-positive guard (same-line two-marker
    # detection), the offset/rotation scan, the already-on-fallback + pricier-fallback + DRY_RUN
    # + disarmed edges. Hermetic (marker-extracted unit, stubbed refresh/tg_send/log, a fixture
    # supervisor.log with the REAL ANSI limit line + fixture instance.env; RED-on-old proven
    # against HEAD, auto-skip when byte-identical).
    model-fallback-test:
      run: bash scripts/model-fallback-selftest.sh
      skip:
        - merge
        - rebase
    # install (v0.5 G1): the one-command installer — `install.sh` clones + PINS the core at the latest
    # STABLE core-v* tag (reusing `kickoff pull`), links ~/.local/bin/kickoff, prints the one-line PATH
    # fix, and is idempotent. Fully hermetic (mktemp local remote + scratch $HOMEs, no network).
    install-test:
      run: bash scripts/install-selftest.sh
      skip:
        - merge
        - rebase
    # release gate (v0.9 slice 1): scripts/release-gate.sh's plugin-version-vs-content invariant (LOCKED
    # decision #1) — if ANY plugin/ file changed vs the prev tag, plugin.json's version MUST bump, else
    # every adopter's `kickoff pull` fails closed at preflight #8 (the exact 2026-07-13 core-v0.8 bug).
    # RED-first: gates the real v0.7→v0.8 regression + a v0.8→v0.8.1 fix + two hermetic /tmp fixtures
    # (content-changed-and-bumped GREEN, content-changed-no-bump RED). Read-only git; pure bash + git.
    release-gate-test:
      run: bash scripts/release-gate-selftest.sh
      skip:
        - merge
        - rebase
    # salvage (v0.21): agent work outlives its session — Claude Code persists every subagent
    # transcript and each workflow agent's return value under ~/.claude/projects/, hook-free, so a
    # limit-kill or SIGKILL destroys nothing. The bug was that nothing READ it, and the read side is
    # what this asserts: found → filed under its tracker item (verbatim text as the join key, never
    # the slug) → surfaced by the TRACKER.md render, including checkpoints matching NO active item,
    # which must still appear rather than vanish. Plus the boot-check contract (--quiet is silent on
    # a clean box) and liveness scoping. Hermetic (a fake $HOME with its own ~/.claude/projects
    # tree); mutation-audited both ways — disabling the render's checkpoint index reds 5 assertions.
    orphaned-work-test:
      run: bash scripts/orphaned-work-selftest.sh
      skip:
        - merge
        - rebase
    # auto-pickup (v0.22): the autonomy grant that lets a fresh worker continue tracker-authorised
    # work with no new steer. The suite is mostly about its REFUSALS — off by default, off on the
    # operator's kill switch, and off when the worker is restarting in a loop (auto-resume and
    # restart-loop are the same event from opposite ends, and a loop bills for re-done work with
    # nobody watching). Guards asserted where they are ENFORCED, in the engine before the session
    # starts, since a prompt can be reasoned around and a bash refusal cannot. Mutation-audited:
    # disabling the loop guard reds 6 assertions. Also pins that AUTO_PICKUP must never join the
    # instance.env whitelist — a gitignored file may configure a worker, never ARM one.
    # probe (07-26): a counting check that cannot report a VACUOUS green. Three times in one
    # day a pattern that matched NOTHING read exactly like a pattern that found nothing wrong
    # — a pgrep that matched its own command line, a mutation whose sed hit nothing, and a
    # health sweep grepping `[ ok ]` at a tool that emits ✓ ("0 ok · 0 fail" for four repos).
    # probe.sh forces the two apart with a mandatory positive control. The suite is RED-first
    # about exactly that distinction: cases 3 and 4 differ ONLY in the control.
    # mount-point (07-27): every dashboard fetch was root-absolute, so a board served under
    # a path-routing ingress at /<tenant>/ loaded and authenticated and then 404'd every data
    # call — presenting as "the token doesn't work". Found by the operator on his own device,
    # not by a review, and not by my own curl of the page (which tested the PAGE, never what
    # the page fetches). RED-first: the suite reconstructs the pre-fix form and proves it trips.
    mc-mountpoint-test:
      run: bash scripts/mc-mountpoint-selftest.sh
      skip:
        - merge
        - rebase
    probe-test:
      run: bash scripts/probe-selftest.sh
      skip:
        - merge
        - rebase
    auto-pickup-test:
      run: bash scripts/auto-pickup-selftest.sh
      skip:
        - merge
        - rebase
    # up --dir launch-config precedence (v1.0.2-alpha): same discovery rule as the comment below —
    # unwired = invisible to the release gate. Proves the TARGET org's instance.env wins its own
    # launch (argv > true pre-set env > target file) and the caller's file-sourced config never rides across --dir.
    up-dir-config-test:
      run: bash scripts/up-dir-config-selftest.sh
      skip:
        - merge
        - rebase
    # agent-mail (v0.23): wired here because release-gate.sh discovers suites ONLY from this block —
    # an unlisted *-selftest.sh is invisible to the gate AND skipped by manifest coverage, so it can
    # rot red while the release reports "all suites GREEN". It shipped orphaned in the first v0.23
    # candidate and the adversarial gate caught it; a suite nothing runs cannot fail.
    agent-mail-test:
      run: bash scripts/agent-mail-selftest.sh
      skip:
        - merge
        - rebase
    # beat-length guard: listed here for the same reason the two above are — the release gate
    # discovers suites ONLY from this block, so an unlisted suite can rot red while the release
    # reports "all suites GREEN". This one guards the hook standing in front of the ONLY channel
    # to the operator, where the failure mode is a SILENT gag: a worker that cannot report that it
    # cannot report. Twelve of its lanes are fail-open proofs; they must never go unrun.
    beat-length-guard-test:
      run: bash scripts/beat-length-guard-selftest.sh
      skip:
        - merge
        - rebase
    # beat NUDGE: the generation-time half of the same pair. Registered here for the identical
    # reason — and it carries two lanes that exist because this project already paid for their
    # absence: a consumer-parse lane (assert on json.loads of the WHOLE stdout, never a substring)
    # and a shipped-wiring lane (a hook missing from hooks.json ships inert and green). It also
    # runs on EVERY user turn, so a regression is charged to the whole fleet, every turn.
    beat-nudge-test:
      run: bash scripts/beat-nudge-selftest.sh
      skip:
        - merge
        - rebase
    # handoff TRIGGER: the third hook on the every-user-turn path, and the one whose failure is
    # hardest to see. It fails SILENT by design, so a broken copy and a healthy quiet one are
    # byte-identical from outside; its suite is mostly POSITIVE lanes for exactly that reason, and
    # an unrun suite would leave the fleet's only degradation alarm unverified.
    context-handoff-nudge-test:
      run: bash scripts/context-handoff-nudge-selftest.sh
      skip:
        - merge
        - rebase
    # context-headroom: the gauge the whole "am I still sharp enough to keep going" decision reads.
    # Registered here for the same reason as the two above — and specifically because its blind
    # spot was not theoretical: it reported a compacted worker as the cheapest on the box, a memory
    # recorded that, and a causal claim was built on it. These lanes are what makes the prose rule
    # ("check for compaction before crediting technique") into something that can fail.
    context-headroom-test:
      run: bash scripts/context-headroom-selftest.sh
      skip:
        - merge
        - rebase
    # agent-mail per-turn hook: listed here for the same reason the suite above is — the release
    # gate discovers suites ONLY from this block. This one guards a hook that runs on EVERY TURN
    # OF EVERY AGENT, so a regression here is charged to the whole fleet, every turn.
    agent-mail-hook-test:
      run: bash scripts/agent-mail-hook-selftest.sh
      skip:
        - merge
        - rebase
    # workspace (v0.24): the release gate discovers suites ONLY from this block, so an unlisted
    # suite is invisible to it AND skipped by manifest coverage — it can rot red while the
    # release reports all-green. This one guards a fan-out, which is a new way to report green
    # on nothing.
    workspace-scan-test:
      run: bash scripts/workspace-scan-selftest.sh
      skip:
        - merge
        - rebase
    # workspace GATE ARMING (v0.24): the same discovery rule applies — an unlisted suite is
    # invisible to the release gate. This one asserts on the CONSUMING ARTIFACT (a real `git
    # commit` in a real member, both directions), because the failure it guards is a green
    # "ARMED" printed over a repo where a planted secret then commits cleanly.
    workspace-adopt-test:
      run: bash scripts/workspace-adopt-selftest.sh
      skip:
        - merge
        - rebase
    # shim env-seal (v0.25): this suite was an ORPHAN — listed in no lefthook block, so the release
    # gate (which discovers suites ONLY from here) never ran it, and it is precisely the suite that
    # pins the .kickoff/bin scan shims' `cd` — the fourth, hidden workspace guard site, rewritten by
    # the marker change. An unregistered suite can rot red while the release reports all-green.
    shim-env-seal-test:
      run: bash scripts/shim-env-seal-selftest.sh
      skip:
        - merge
        - rebase
    identity-test:
      run: bash scripts/scan-identity-selftest.sh
      skip:
        - merge
        - rebase
    # ship-turnkey (v0.23): the release turnkey's three ordinary preconditions — fast-forwards main,
    # tag is new, plugin invariant — ALL PASS ON A STALE BRANCH, which is how a staged release sat
    # for a day carrying the very blocker it was held for while its header advertised a gate run
    # from another commit. So the generator pins the SHA the gate certified and the emitted script
    # REFUSES any other tip, and `--no-verify` cannot outlive the justification that earns it. This
    # suite makes all of that able to FAIL: the generator refuses a --gated-at that is not the tip,
    # the structural guard refuses 13 mutated renders, and the emitted script goes RED on a real
    # re-staged fixture branch — with the three old checks passing first, which is the point. One
    # lane really pushes, to a bare repo inside its own mktemp dir and nowhere else.
    ship-turnkey-test:
      run: bash scripts/ship-turnkey-selftest.sh
      skip:
        - merge
        - rebase
    # memory-lifecycle Slice A: the supersede truth-invariant + the index-budget guard, each proven
    # RED-first (a live contradiction / an over-budget index FAILS; the cleaned / under-budget case
    # passes). Pure bash + coreutils (+ git for the supersede typo guard). Hermetic mktemp fixtures.
    memory-supersede-test:
      run: bash scripts/memory-supersede-selftest.sh
      skip:
        - merge
        - rebase
    memory-budget-test:
      run: bash scripts/memory-budget-selftest.sh
      skip:
        - merge
        - rebase
